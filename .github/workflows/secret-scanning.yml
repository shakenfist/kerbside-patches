name: Secret scanning

# Deliberately its own workflow rather than a job in rebase-tests.yml or
# functional-tests.yml. Both of those carry a paths-ignore filter, and a
# credential pasted into documentation is still a credential -- the one
# real key secret the equivalent scan found in Shaken Fist's own history
# was published in its user guide. This lane must therefore run on every
# pull request, whatever changed.
#
# What it scans depends on the event. A pull request scans only its own
# commits, and a push to develop only the commits that push added: the
# whole history takes over ten minutes here, and rescanning it on every
# event held one of the two shared static runners for that long each
# time, queueing every other repository's gate jobs behind it. The full
# history is still scanned daily, on demand, and whenever the scan's own
# rules change -- see tools/gitleaks-scan.sh and docs/security-scanning.md.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '41 16 * * *'   # utc
  workflow_dispatch:

# A newer push to a pull request supersedes the scan of the older one,
# whose commits the new range still covers. Pushes to develop are never
# cancelled: each scans a distinct range, and a cancelled one would
# leave its commits unscanned until the next full-history run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # gitleaks is downloaded rather than apt-installed because the shared
  # static pool does not grant passwordless sudo, and because gitleaks is
  # only packaged from Debian 13 onward. Version and checksum are both
  # pinned: .gitleaks.toml is written against 8.16's schema (per-rule
  # allowlists changed shape in a later release), and a detector which
  # silently changes behaviour under us is worse than no detector. To
  # move the pin, run tools/gitleaks-scan.sh against the new version
  # locally first and check the positive control still passes.
  credential_scan:
    name: "Credential scan"
    runs-on: [self-hosted, static]
    # A full-history scan walks every commit reachable from HEAD, and
    # this repository's history carries large patch files, so it takes
    # over ten minutes rather than the few seconds it does on a source
    # tree. This is the backstop for a wedged job, not a target.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is load bearing. The scan covers every commit
      # reachable from HEAD, and tools/gitleaks-scan.sh refuses to run
      # against a shallow clone rather than reporting a clean history it
      # never looked at.
      - name: Checkout code with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.16.0/gitleaks_8.16.0_linux_x64.tar.gz
          echo "f8d4fabedaeaabd2a3e7e7b96394b8ddeff0be32941a1719aedee08fc8678601  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # SCAN_RANGE is empty for schedule and workflow_dispatch, which
      # scan the full history. The script also widens a range to the
      # full history itself when the range changes the scan's rules, or
      # when its start is not in the clone (a force push to develop).
      - name: Scan for credentials
        env:
          SCAN_RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || github.event_name == 'push'
                && format('{0}..{1}', github.event.before, github.event.after)
                || '' }}
        run: tools/gitleaks-scan.sh --gitleaks /tmp/gitleaks ${SCAN_RANGE:+--range "$SCAN_RANGE"}
