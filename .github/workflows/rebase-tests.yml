name: Rebase tests

# NOTE(mikal): git repos are checked out to /srv/github/_work/{repo}/{repo}
# which is available as GITHUB_WORKSPACE. You can find other environment
# variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables
#
# This workflow is called from functional-tests.yml rather than being
# triggered directly on pull requests. These jobs run directly on
# conductor-provisioned VM runners (debian-13 and rocky-9). The runner is
# already the OS under test, so the patch test suites run locally via
# _build/test-apply.sh -- there is no longer any bare-metal runner or
# nested Shakenfist VM involved.

# Checkout only. The automated lint fixer checks out and pushes with
# DAILY_REBASE_TOKEN, which carries its own scope.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true
      patch_tests:
        type: string
        required: true

jobs:
  # Guard against infinite loops: skip automated fixers if the last
  # commit was from the bot.
  check_bot_commit:
    name: "Check bot commit"
    runs-on: [self-hosted, static]
    outputs:
      is_bot: ${{ steps.check.outputs.is_bot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check if last commit was from bot
        id: check
        run: |
          LAST_AUTHOR_EMAIL=$(git log -1 --format='%ae')
          echo "Last commit author: $LAST_AUTHOR_EMAIL"
          if [ "$LAST_AUTHOR_EMAIL" = "bot@shakenfist.com" ]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

  # Lightweight lint-only check that runs in parallel with the full
  # test matrix. Applies patches (without tests) and runs ansible-lint
  # via tox -elinters. Much faster than the deep test matrix.
  lint_check:
    name: "Ansible lint check"
    runs-on: [self-hosted, vm, debian-13, m]
    outputs:
      linters_failed: ${{ steps.lint.outcome == 'failure' }}
    concurrency:
      group: >-
        ${{ github.workflow }}-patch-lint-${{ inputs.tier }}-${{
        github.event_name == 'merge_group' && github.run_attempt == '1' &&
        format('merge_group-{0}', github.event.merge_group.base_ref) ||
        github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Configure pip to use local PyPI mirror
        run: |
          mkdir -p ~/.config/pip
          cat > ~/.config/pip/pip.conf <<'PIPCONF'
          [global]
          index-url = https://devpi.home.stillhq.com/root/pypi/+simple/
          PIPCONF

      - name: Install test dependencies
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          tools/ci-install-test-deps.sh

      - name: Run kolla-ansible linters
        id: lint
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          tools/check-kolla-ansible-lint.sh

  # Runs if the lint_check job fails and the last commit was not
  # from the bot. Uses Claude Code to fix lint errors in patch files.
  automated_lint_fixer:
    name: "Automated lint fixer"
    runs-on: [self-hosted, claude-code]
    needs: [lint_check, check_bot_commit]
    if: >-
      ${{ always() &&
          needs.lint_check.outputs.linters_failed == 'true' &&
          needs.check_bot_commit.outputs.is_bot != 'true' &&
          github.event_name == 'pull_request' }}
    concurrency:
      group: >-
        ${{ github.workflow }}-patch-lint-fixer-${{ inputs.tier }}-${{
        github.event_name == 'merge_group' && github.run_attempt == '1' &&
        format('merge_group-{0}', github.event.merge_group.base_ref) ||
        github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DAILY_REBASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Claude Code run by Shakenfist Bot"
          git config user.email "bot@shakenfist.com"

      - name: Run automated lint fixer
        run: |
          tools/fix-lint-with-claude.sh --ci

  patch_tests:
    name: "Patch tests on ${{ matrix.test.description }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.patch_tests) }}
    runs-on: [self-hosted, vm, '${{ matrix.test.runs_on }}', 'xl']
    timeout-minutes: 150
    concurrency:
      group: >-
        ${{ github.workflow }}-patch-tests-${{ matrix.test.name }}-${{ inputs.tier }}-${{
        github.event_name == 'merge_group' && github.run_attempt == '1' &&
        format('merge_group-{0}', github.event.merge_group.base_ref) ||
        github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Configure pip to use local PyPI mirror
        run: |
          mkdir -p ~/.config/pip
          cat > ~/.config/pip/pip.conf <<'PIPCONF'
          [global]
          index-url = https://devpi.home.stillhq.com/root/pypi/+simple/
          PIPCONF

      - name: Install test dependencies
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          tools/ci-install-test-deps.sh

      - name: Deep test patches for kolla
        if: ${{ !cancelled() && contains(matrix.test.projects, 'kolla') }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          ./_build/test-apply.sh kolla

      - name: Deep test patches for kolla-ansible
        if: ${{ !cancelled() && contains(matrix.test.projects, 'kolla-ansible') }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          ./_build/test-apply.sh kolla-ansible

      - name: Deep test patches for kolla-deployer
        if: ${{ !cancelled() && contains(matrix.test.projects, 'kolla-deployer') }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          ./_build/test-apply.sh kolla-deployer

      - name: Deep test patches for kolla-ansible-deployer
        if: ${{ !cancelled() && contains(matrix.test.projects, 'kolla-ansible-deployer') }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          ./_build/test-apply.sh kolla-ansible-deployer
