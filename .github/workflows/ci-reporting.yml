name: CI reliability reporting

# On-demand refresh of the OpenDev CI reliability datasets and charts in
# data/ci-reporting/ (see tools/ci-report.sh for the report catalogue). The
# dropdown picks which report to refresh; state is committed so runs are
# incremental and gentle on the OpenDev infrastructure. Each run uploads the
# refreshed data as a workflow artifact and proposes a PR updating the
# committed data.
#
# The scan runs on an ephemeral vm runner, but PR creation runs on a
# static runner because gh is only installed there (the same split the
# layer data flow in functional-tests.yml uses). The workflow artifact
# carries the refreshed data between the two jobs.

# The reporting job checks out with the default token; everything that
# writes (the branch push and the pull request) runs as
# DAILY_REBASE_TOKEN, which carries its own scope.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      report:
        description: Which CI reliability report to refresh
        type: choice
        required: true
        default: mariadb-ist
        options:
          - mariadb-ist
          - wsrep-sync-fatal
          - libvirt-limit
          - ovs-create-tap
          - scheduler-unhealthy
          - fluentd-missing-logs
          - all

jobs:
  ci-report:
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 300
    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7

      - name: Refresh CI reliability dataset and chart
        run: ./tools/ci-report.sh "${{ inputs.report }}"

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-${{ inputs.report }}
          path: data/ci-reporting/

  propose-pr:
    needs: ci-report
    runs-on: [self-hosted, static]
    timeout-minutes: 30
    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DAILY_REBASE_TOKEN }}

      - name: Download refreshed report data
        uses: actions/download-artifact@v8
        with:
          name: ci-report-${{ inputs.report }}
          path: data/ci-reporting

      - name: Propose data update PR
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPORT: ${{ inputs.report }}
        run: ./tools/ci-report-propose-pr.sh
