name: Trigger downstream CI

# Nothing here uses GITHUB_TOKEN: there is no checkout, and the
# downstream dispatch runs as DAILY_REBASE_TOKEN because it targets
# another repository.
permissions: {}

on:
  push:
    branches:
      - develop

jobs:
  trigger-kerbside:
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      - name: Trigger kerbside cloud compatibility tests
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
        run: |
          gh workflow run functional-tests.yml \
              --repo shakenfist/kerbside \
              -f target='["kolla-ansible-master-debian-12"]'
