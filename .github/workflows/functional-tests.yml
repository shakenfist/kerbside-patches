name: Ensure the cloud is still installable

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  functional_matrix:
    name: "Build a test cloud for ${{ matrix.test.description }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': '2024.1-rocky9',
            'description': 'OpenStack release 2024.1 on Rocky 9',
            'release': '2024.1',
            'base': 'rocky:9',
            'baseuser': 'cloud-user'
          },
          {
            'name': 'master-debian12',
            'description': 'OpenStack master on Debian 12',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian'
          },
          {
            'name': 'master-rocky9',
            'description': 'OpenStack master on Rocky 9',
            'release': 'master',
            'base': 'rocky:9',
            'baseuser': 'cloud-user'
          },
        ]
    runs-on: [self-hosted, vm]
    timeout-minutes: 300
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.test.name }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Set environment variables
        run: |
          echo "SF_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          echo "SHAKENFIST_NAMESPACE=$(hostname)" >> $GITHUB_ENV

      - name: Checkout kerbside-patches
        uses: actions/checkout@v4
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Set some more environment variables post git checkout
        run: |
          . $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}/kerbside-patches

          short_sha=$(git rev-parse --short HEAD)
          echo "SF_SHORT_HEAD_SHA=${short_sha}" >> $GITHUB_ENV

      - name: Install required packages
        run: |
          sudo pip3 install yq

      - name: Attempt to apply patches
        run: |
          . $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}/kerbside-patches/tools
          ./assemble-source ${{ matrix.test.release }}

      - name: Build infrastructure
        run: |
          . $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} base=${{ matrix.test.base }}" \
              --tags all cloud-deployment.yml

      - name: Copy git repo
        run: |
          . $GITHUB_ENV
          rm -rf kerbside-patches/src
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/kerbside-patches ${{ matrix.test.baseuser }}@10.0.2.2:.

      - name: Upgrade python for releases newer than 2024.2
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}

          release_year=$(echo "${{ matrix.test.release }}" | cut -f 1 -d ".")

          if [ "${release_year}" != "2024" ]; then
            ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null ${{ matrix.test.baseuser }}@10.0.2.2 \
                  "cd kerbside-patches/tools; sudo ./upgrade-python"
          else
            echo "2024 releases do not require a newer python, skipping"
          fi

      - name: Install dependencies
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; ./install-build-dependencies'

      - name: Setup docker registry
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; sudo ./install-docker-registry'

      - name: Build patched repositories
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; ./assemble-source ${{ matrix.test.release }}'

      - name: Build container images
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; ./build-containers  ${{ matrix.test.release }}'

      - name: Disable /etc/hosts for name resolution
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo sed -i s"|hosts:      files dns myhostname|hosts:      dns myhostname|" /etc/nsswitch.conf'

      - name: Bootstrap Kolla-Ansible
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; sudo ./bootstrap-kolla-ansible ${{ matrix.test.release }}'

      - name: Install Kolla-Ansible
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; sudo ./install-kolla-ansible'

      - name: Install patched OpenStack clients
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; sudo ./install-openstack-clients'

      - name: Post install Kolla-Ansible setup
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; sudo ./postinstall-kolla-ansible'

      - name: Attempt to start an instance with a console and connect to it
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd kerbside-patches/tools; sudo ./test-console'