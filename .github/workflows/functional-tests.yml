name: Build test clouds

# auto-retry-infra-failures.yml finds this workflow by its name, so a rename
# needs a matching change there.
#
# Two tier CI. Every pull request runs the smoke tier, and merge queue
# entries run the merge tier on the commit that will actually land. Which
# lanes sit in which tier is data rather than workflow: .github/ci-lanes.json
# lists every image build, install test and patch test lane with the tiers
# it runs in, and check_paths selects them for the event, so each kind of
# job below has exactly one definition. A manual dispatch runs the smoke
# tier unless it asks for tier=full, which runs the merge tier's lanes.
#
# The patch tests (rebase-tests.yml) and the local build
# (local-container-builds.yml) are reusable workflows called from here, so
# that this one workflow carries every result the merge gates need.
#
# The can_enqueue / can_merge collection job scheme is as described at:
# https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
# Both are meant to be the required status checks: can_enqueue reports on
# pull requests and dispatches, can_merge on merge queue entries, and each
# is skipped (which GitHub treats as success) for the other event.

# Checkout only. The layer-data pull request at the end of the run is
# made with DAILY_REBASE_TOKEN, which carries its own scope. The few jobs
# that need more of GITHUB_TOKEN grant it themselves.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      data_prefix:
        description: 'Subdirectory of data/ for layer time series files'
        required: false
        default: 'layers'
      tier:
        description: 'Which lanes to run: smoke (the pull request lanes) or full (the merge queue lanes)'
        type: choice
        options:
          - smoke
          - full
        default: smoke
  merge_group:
  # Deliberately no trigger-level paths-ignore; check_paths explains why.
  pull_request:
    branches:
      - develop

jobs:
  # Detect changes touching only docs/, data/ (the time series the CI bots
  # write) or README.md so the heavy jobs can skip.
  # This replaces the old trigger-level paths-ignore, which cannot
  # coexist with required status checks: a required check in a
  # paths-ignore'd workflow never reports on a filtered PR, and a
  # required check that never reports blocks the merge forever. With a
  # filter job the workflow always reports, the heavy jobs skip on its
  # output, and a skipped required check counts as satisfied. On
  # workflow_dispatch the filter step is skipped and the output
  # defaults to code_changed=true so all selected lanes run.
  #
  # The filter also runs on merge_group, so a docs-only or data-only
  # queue entry skips the whole matrix as well.
  #
  # After the verdict the job selects the lanes for the event, and on
  # merge_group it cancels the run if the queue entry has been rebuilt onto
  # a newer base; see the last step. Both read the tree, so unlike the
  # filter the checkout runs on every event, dispatches included.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # actions: write is for the last step, which cancels its own run.
    # Naming any scope sets every unnamed one to none, so contents: read
    # is restated for the checkout. The filter needs no pull-requests:
    # read because this repository is public.
    permissions:
      contents: read
      actions: write
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
      builds: ${{ steps.lanes.outputs.builds }}
      installs: ${{ steps.lanes.outputs.installs }}
      patch_tests: ${{ steps.lanes.outputs.patch_tests }}
      run_builds: ${{ steps.lanes.outputs.run_builds }}
      run_installs: ${{ steps.lanes.outputs.run_installs }}
      run_patch_tests: ${{ steps.lanes.outputs.run_patch_tests }}
      run_local_build: ${{ steps.lanes.outputs.run_local_build }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # On merge_group, compare against the base_sha fixed in the
          # event payload, the develop commit the queue built this
          # entry on, not against the develop branch itself. The
          # branch moves: once the queue has merged this entry, develop
          # contains the queued commit, so a "Re-run all jobs" of the
          # run would diff against a base already holding HEAD, find
          # nothing, and let "Can merge" go green on skips having
          # tested nothing. A re-run keeps its original payload, so it
          # sees the same diff as the first attempt. On pull_request
          # events the action ignores base and compares against the
          # PR's base branch; develop is only the fallback for an event
          # with no merge_group payload.
          base: ${{ github.event.merge_group.base_sha || 'develop' }}
          # By default a file matches the filter if it matches ANY
          # listed pattern, which makes '**' match everything and
          # silently defeats the exclusions. 'every' requires a file
          # to match ALL patterns, which is the correct semantics for
          # an "everything except docs and data" filter.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!data/**'
              - '!README.md'
      # Make the verdict visible in the log rather than inferred from
      # which downstream jobs skipped.
      - name: Report verdict
        run: echo "code_changed=${{ steps.filter.outputs.code || 'true (defaulted)' }}"

      # Prints the build, install and patch test matrices for this event,
      # and a run_ flag beside each. A job whose fromJSON matrix is empty
      # fails rather than skips, so each matrix job is gated on its flag
      # instead. The selection is echoed to the log as well; shell: bash
      # adds pipefail, so a selector failure is not hidden by tee.
      - name: Select lanes
        id: lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TIER: ${{ inputs.tier }}
          CODE_CHANGED: ${{ steps.filter.outputs.code || 'true' }}
        run: |
          tools/ci-select-lanes.py --lanes .github/ci-lanes.json \
              --event "${EVENT_NAME}" --tier "${TIER}" \
              --code-changed "${CODE_CHANGED}" | tee -a "$GITHUB_OUTPUT"

      # A superseded merge group run cancels itself here, before any of its
      # jobs enter the merge-group-keyed concurrency groups below. Without
      # this, which of two runs for the same queue entry survives is decided
      # by whose Check paths finishes last, and it can be the stale one
      # (shakenfist/shakenfist#3998). It must stay the last step of the job
      # every queue job needs: the check is only as good as the gap between
      # it and those jobs entering their groups is short. The script
      # explains why that gap is safe, and which way it fails when it cannot
      # tell.
      - name: Cancel this run if the merge group is superseded
        if: github.event_name == 'merge_group'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          RUN_ID: ${{ github.run_id }}
        run: tools/ci-merge-group-current.sh

  lint:
    name: "Lint shell scripts and workflows"
    needs: check_paths
    if: needs.check_paths.outputs.code_changed == 'true'
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 30
    # On every event except merge_group, github.ref identifies the thing
    # being tested and is the right concurrency key. On merge_group it is
    # the per-attempt queue branch, gh-readonly-queue/develop/pr-NNN-SHA,
    # and GitHub mints a fresh SHA every time it rebuilds the group --
    # which it does on each push to develop. Keying on it would put every
    # rebuild in a group of its own, so cancel-in-progress would never
    # match and superseded runs would build whole clouds on the shared
    # under-cloud to completion, starving the one group that can merge.
    #
    # Cancelling them is safe while the develop ruleset keeps
    # max_entries_to_build at 1: the queue then builds one entry at a time,
    # and any other first attempt of a merge_group run is by definition
    # superseded. Those runs are keyed on the base branch so they share one
    # group. A re-run is not a queue build, though. It keeps its original
    # event, so with the base-branch key a "Re-run jobs" on an old queue
    # run would cancel the live queue entry or be cancelled by it. Re-runs
    # therefore keep their own queue branch's group. The merge_group-
    # prefix keeps a queue run from colliding with a workflow_dispatch run
    # on develop, whose github.ref is the same branch.
    #
    # Every job here on a vm or bound runner is keyed this way, and so are
    # the jobs of the workflows called below. Inside a called workflow
    # github.workflow is this workflow's name, so the called jobs use
    # patch- and local-build- prefixes, which no job here may reuse.
    concurrency:
      group: >-
        ${{ github.workflow }}-lint-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7

      - name: Configure pip to use local PyPI mirror
        run: |
          mkdir -p ~/.config/pip
          cat > ~/.config/pip/pip.conf <<'PIPCONF'
          [global]
          index-url = https://devpi.home.stillhq.com/root/pypi/+simple/
          extra-index-url = https://pypi.org/simple/
          PIPCONF

      - name: Install pre-commit and shellcheck
        run: |
          python3 -mvenv pre-commit
          pre-commit/bin/pip3 install pre-commit
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run pre-commit
        run: pre-commit/bin/pre-commit run --all-files

  assemble_source:
    name: "Assemble source for ${{ matrix.test.release }}"
    needs: check_paths
    if: needs.check_paths.outputs.code_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        test: [
          # {
          #   'release': '2026.1'
          # },
          {
            'release': 'master'
          },
        ]
    runs-on: [self-hosted, vm, 'debian-13', 'xl']
    timeout-minutes: 30
    # Keyed as lint's is, for the reasons given there.
    concurrency:
      group: >-
        ${{ github.workflow }}-source-${{ matrix.test.release }}-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Install dependencies on local runner
        run: |
          . $GITHUB_ENV
          cd kerbside-patches

          ./_build/install-build-dependencies.sh
          ./_build/setup-local-build-environment.sh

      - name: Build patched repositories
        run: |
          . $GITHUB_ENV
          cd kerbside-patches
          ./_build/assemble-source.sh --use-ci-patches ${{ matrix.test.release }}

          # We need a sub directory to make the code more obvious on artifact fetch
          cd src
          mkdir src
          mv ./*.tgz src/

      - uses: actions/upload-artifact@v7
        id: upload_source
        if: success()
        with:
          name: source-${{ matrix.test.release }}
          retention-days: 90
          if-no-files-found: error
          path: kerbside-patches/src

  build_images:
    name: "Images for ${{ matrix.test.release }} on ${{ matrix.test.container_distro }} ${{ matrix.test.container_distro_version }}"
    needs: [check_paths, assemble_source]
    # The lanes are the builds in .github/ci-lanes.json that check_paths
    # selected for this event. An empty matrix would fail the job, so it is
    # gated on the selector's flag rather than on the matrix.
    if: needs.check_paths.outputs.run_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check_paths.outputs.builds) }}
    runs-on: [self-hosted, vm, 'debian-13', 'xl']
    timeout-minutes: 180
    # Keyed as lint's is, for the reasons given there.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ matrix.test.name }}-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Install dependencies on local runner
        run: |
          . $GITHUB_ENV
          cd kerbside-patches

          ./_build/install-build-dependencies.sh
          ./_build/setup-local-build-environment.sh
          ./_build/add-insecure-ci-registry.sh

          # This is terrible, but its easier than reloading groups
          sudo chmod ugo+rw /var/run/docker.sock

      - name: Dump docker daemon.json
        run: cat /etc/docker/daemon.json

      - name: Ensure CI OCI registry works
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
        run: |
          . $GITHUB_ENV

          echo "Make test image..."
          identifier=$(hostname | sed 's/\..*//')

          echo ${identifier} > identifier
          cat - > Dockerfile <<EOF
          FROM scratch
          COPY identifier identifier
          EOF
          # Attestations produce an OCI index whose child manifests docker
          # 29.7.0 pushes in an order the GitLab registry rejects ("blob
          # unknown to registry"). The heartbeat doesn't need provenance.
          docker build --provenance=false -t heartbeat:latest .

          echo
          echo "Log into regisry..."
          echo ${CI_REGISTRY_TOKEN} | docker login \
              gitlab.home.stillhq.com:5050 --username kolla-imgs --password-stdin

          echo
          echo "Push to registry..."
          docker image tag heartbeat:latest gitlab.home.stillhq.com:5050/openstack/kolla-images/ci_heartbeat:${identifier}
          docker image push gitlab.home.stillhq.com:5050/openstack/kolla-images/ci_heartbeat:${identifier}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: source-${{ matrix.test.release }}

      - name: Move source to correct location
        run: |
          . $GITHUB_ENV

          echo "Contents of ${GITHUB_WORKSPACE}"
          ls -lrt

          mkdir -p ${GITHUB_WORKSPACE}/kerbside-patches/src
          for item in src/*.tgz; do
              echo "Extracting ${item}"
              tar xzf ${item} -C ${GITHUB_WORKSPACE}/kerbside-patches/src/
          done

          echo
          echo "Contents of ${GITHUB_WORKSPACE}/kerbside-patches/src/"
          ls -lrt ${GITHUB_WORKSPACE}/kerbside-patches/src/

          echo
          echo "Done"

      - name: Build container images
        id: build_images
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
        run: |
          . $GITHUB_ENV
          cd kerbside-patches

          hash=$(./_build/calculate-container-hash.sh \
              kolla kolla-ansible ansible-collection-kolla \
              etc src _build tools )
          if [ -z "${hash}" ]; then
              echo "Container hash calculation failed, refusing to build" >&2
              echo "with a malformed image tag (seen with runner disk errors)." >&2
              exit 1
          fi

          # I aggressively filter the images built here for performance
          # and reliability reasons in my homelab CI. _All_ images are
          # built in the "ensure local builds" CI jobs to ensure coverage.
          build_regexp="^(base|collectd|cron|dnsmasq|etcd|fluentd"
          build_regexp="${build_regexp}|glance|grafana|hacluster"
          build_regexp="${build_regexp}|haproxy|horizon|httpd|iscsid"
          build_regexp="${build_regexp}|keepalived|kerbside|keystone"
          build_regexp="${build_regexp}|kolla|magnum|mariadb|memcached"
          build_regexp="${build_regexp}|multipathd|neutron|nova"
          build_regexp="${build_regexp}|openstack|openvswitch|placement"
          build_regexp="${build_regexp}|prometheus|proxysql|rabbitmq"
          build_regexp="${build_regexp}|telegraf|tgtd|valkey)"

          ./_build/build-containers.sh \
              --use-ci-registry \
              --use-proxy \
              --registry-username kolla-imgs \
              --registry-token "${CI_REGISTRY_TOKEN}" \
              --build-targets "${{ matrix.test.release }}" \
              --build-images "${build_regexp}" \
              --distro ${{ matrix.test.container_distro}} \
              --distro-version ${{ matrix.test.container_distro_version }} \
              --image-tag ${hash} \
              --dont-fetch-images

          echo "image_tag=${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}-${hash}" >> ${GITHUB_OUTPUT}

      - name: Dump build.json
        if: always()
        run: |
          . $GITHUB_ENV
          if [ -e kerbside-patches/archive/build.json ]; then
              python3 -m json.tool < kerbside-patches/archive/build.json
          else
              echo "File not found"
          fi

      - name: Dump layer data summary
        if: always()
        run: |
          . $GITHUB_ENV
          if [ -d kerbside-patches/archive/layers ]; then
              echo "Layer data files:"
              ls -lh kerbside-patches/archive/layers/
              echo
              echo "Line counts:"
              wc -l kerbside-patches/archive/layers/*.jsonl 2>/dev/null || echo "No JSONL files"
          else
              echo "No layer data directory found"
          fi

      - name: Collect Docker daemon diagnostics
        if: always()
        run: |
          . $GITHUB_ENV
          clingwrap gather \
              --target openstack-kolla-ansible \
              --output /tmp/clingwrap-bundle.zip

      # We have the output of the build job and its config, regardless of success or failure
      - name: Archive build config and logs
        if: always()
        run: |
          . $GITHUB_ENV

          # Not all these files will exist if the build above was skipped because the images
          # already exist
          archive_path="/tmp/${{ matrix.test.name }}"
          mkdir ${archive_path}

          echo ${{ steps.build_images.outputs.image_tag }} > ${archive_path}/image_tag

          # Record the run attempt so collect_layer_data can filter out stale artifacts
          # from previous attempts when a single job is retried
          echo "${{ github.run_attempt }}" > ${archive_path}/run_attempt

          if [ -e /tmp/clingwrap-bundle.zip ]; then
              cp /tmp/clingwrap-bundle.zip ${archive_path}/
          fi

          if [ -e kerbside-patches/archive/build.log ]; then
              cp kerbside-patches/archive/build.log ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/build.json ]; then
              cp kerbside-patches/archive/build.json ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/layers.tar.gz ]; then
              cp kerbside-patches/archive/layers.tar.gz ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/kolla-build.conf ]; then
              cp kerbside-patches/archive/kolla-build.conf ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/occystrap-layer-cache.json ]; then
              cp kerbside-patches/archive/occystrap-layer-cache.json ${archive_path}/
          fi
          if [ -d kerbside-patches/archive/debsecan ]; then
              cp -r kerbside-patches/archive/debsecan ${archive_path}/
          fi
          for manifest in kerbside-patches/archive/manifest-*.json; do
              if [ -e "${manifest}" ]; then
                  cp "${manifest}" ${archive_path}/
              fi
          done

          # System details for debugging
          docker info > ${archive_path}/docker-info.txt
          if [ -e /etc/docker/daemon.json ]; then
              cp /etc/docker/daemon.json ${archive_path}/
          else
              echo "No daemon.json found" > ${archive_path}/daemon.json
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.test.name }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/${{ matrix.test.name }}

      # This works around the limited support in Github Actions for outputs from matrices
      - name: Write outputs to a temporary file
        if: success()
        run: |
          echo "{" \
              "\"release\": \"${{ matrix.test.release }}\"," \
              "\"image_tag\": \"${{ steps.build_images.outputs.image_tag }}\"" \
              "}" >> /tmp/result.json

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: buildresult-${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/result.json

  # Only downloads artifacts and joins some JSON, so it holds no VM.
  aggregate_results:
    name: "Aggregate results"
    needs: build_images
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    outputs:
      all_results: ${{ steps.combine.outputs.results }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: buildresult-*

      - name: Combine results and expose as an output
        id: combine
        run: |
          # Collect all results into a JSON array
          results="["
          for dir in buildresult-*/; do
            value=$(cat "${dir}result.json")
            results="${results}${value},"
          done

          # Terminate array and remove trailing comma
          results="${results%,}]"
          echo "results=${results}" >> $GITHUB_OUTPUT

  test_installs:
    name: "${{ matrix.test.description }} using ${{ matrix.test.container_distro }} containers"
    needs: [check_paths, build_images, aggregate_results]
    # The lanes are the installs in .github/ci-lanes.json that check_paths
    # selected for this event, gated on its flag as build_images is.
    if: needs.check_paths.outputs.run_installs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check_paths.outputs.installs) }}
    # This job is an orchestrator, not the machine under test: the cloud
    # being deployed is built as instances on the Shaken Fist cluster by
    # the actions repository's kerbside-*-node playbooks, and the runner
    # only assembles source, copies it across and drives the deploy over
    # ssh. The runner footprint is therefore that of "s".
    #
    # The job is bound to its own runner. The labels are prefixed
    # "bound-" so that no unbound job's labels can be a subset of the
    # runner's (an unbound [self-hosted, debian-13, s] job could
    # otherwise take it), and the "bind-" token is unique per run,
    # attempt and matrix row. See shakenfist/private-ci
    # docs/capacity-claims.md, "Binding a job to its runner".
    # strategy.job-index counts within one job only, so the token stays
    # unique only while this is the one job in the workflow binding its
    # runners with the build-test-clouds token.
    runs-on: [self-hosted, 'bound-${{ matrix.test.runs_on }}', bound-s, "bind-${{ github.run_id }}-${{ github.run_attempt }}-build-test-clouds-${{ strategy.job-index }}"]
    timeout-minutes: 120
    # Keyed as lint's is, for the reasons given there.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ matrix.test.name }}-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Make /srv/shakenfist
        run: |
          sudo mkdir /srv/shakenfist
          sudo chown debian:debian /srv/shakenfist

      - name: Checkout the actions repository
        uses: actions/checkout@v7
        with:
          repository: shakenfist/actions
          path: actions
          fetch-depth: 0

      - name: Download relevant build results
        uses: actions/download-artifact@v8
        with:
          pattern: "buildresult-${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}*"
          # Since download-artifact v5, a pattern matching a single artifact is
          # extracted directly into the destination instead of a subdirectory
          # named after the artifact. Merge into an explicit path so the layout
          # is the same no matter how many artifacts match.
          path: "buildresult-${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}"
          merge-multiple: true

      - name: Log incoming results
        id: incoming
        run: |
          echo "State of workspace:"
          ls -lrt

          echo
          echo "Results from image build step:"
          echo '${{ needs.aggregate_results.outputs.all_results }}' | python3 -m json.tool

          echo
          distro_ver="${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}"
          echo "Distro version is: ${distro_ver}"

          echo
          echo "Results specific to this job:"
          cat buildresult-${{ matrix.test.release }}-${distro_ver}/result.json | python3 -m json.tool

          echo
          echo "Export results specific to this job..."
          image_tag=$(cat buildresult-${{ matrix.test.release }}-${distro_ver}/result.json | jq -r .image_tag)
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT
          echo "    image_tag is ${image_tag}"

      - name: Checkout shakenfist
        uses: actions/checkout@v7
        with:
          repository: shakenfist/shakenfist
          path: shakenfist

      - name: Install the shakenfist ansible collection
        run: |
          # The kerbside playbooks run by setup-kerbside-environment resolve
          # their sf_* modules from the shakenfist.shakenfist collection, so
          # it must be installed on this runner before the playbook runs.
          ${GITHUB_WORKSPACE}/actions/tools/install-collection.sh

      - name: Setup test environment
        uses: shakenfist/actions/setup-kerbside-environment@main
        with:
          base: ${{ matrix.test.base }}
          base_user: ${{ matrix.test.baseuser }}
          openstack_release: ${{ matrix.test.release }}
          topology: ${{ matrix.test.topology }}
          # The containerised deployer's launcher installs an engine itself.
          install_docker: ${{ matrix.test.deployer != 'launcher' }}

      - name: Dump CI environment details
        run: |
          cat ci-environment.sh

      - name: Log getent resolution for kolla
        if: "contains(matrix.test.topology, 'all-in-one')"
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo getent ahostsv4 kolla'

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: source-${{ matrix.test.release }}

      - name: Move source to correct location
        run: |
          . $GITHUB_ENV

          echo "Contents of ${GITHUB_WORKSPACE}"
          ls -lrt

          mkdir -p ${GITHUB_WORKSPACE}/kerbside-patches/src
          for item in src/*.tgz; do
              echo "Extracting ${item}"
              tar xzf ${item} -C ${GITHUB_WORKSPACE}/kerbside-patches/src/
          done

          echo
          echo "Contents of ${GITHUB_WORKSPACE}/kerbside-patches/src/"
          ls -lrt ${GITHUB_WORKSPACE}/kerbside-patches/src/

          echo
          echo "Done"

          echo
          echo "Copy source to target node..."

          # I use tar here because some of the entries are symlinks
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          tar czf - src | ssh -i /srv/github/id_ci \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "cd /srv/shakenfist/kerbside-patches && tar xzf -"

      - name: Deploy Kolla-Ansible
        uses: shakenfist/actions/deploy-kolla-ansible@main
        with:
          base_user: ${{ matrix.test.baseuser }}
          image_tag: ${{ steps.incoming.outputs.image_tag }}
          build_targets: ${{ matrix.test.release }}
          topology: ${{ matrix.test.topology }}
          registry_token: ${{ secrets.CI_REGISTRY_TOKEN }}
          enable_kerbside: ${{ matrix.test.enable_kerbside }}
          use_ci_registry: 'true'
          container_distro: ${{ matrix.test.container_distro }}
          deployer: ${{ matrix.test.deployer || 'venv' }}

      - name: Assert the containerised deployer prototype was selected
        if: matrix.test.deployer == 'launcher'
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./tools/check-deployer-launcher ${{ matrix.test.baseuser }}'

      - name: Assert the containerised deployer guards work
        if: matrix.test.deployer == 'launcher'
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./tools/check-deployer-guards'

      - name: Assert the deployer's build manifest pins every image
        if: matrix.test.deployer == 'launcher'
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./tools/check-deployer-manifest'

      # Post-deploy sanity scripts that Zuul runs against the
      # kolla-ansible source tree. These are cheap (seconds) and catch
      # the same /etc/kolla permission and container-health regressions
      # that surface late in Zuul. Tempest is deliberately *not* run
      # here -- it would add 30-90 minutes per matrix entry.
      #
      # tests/check-logs.sh is intentionally NOT run: it requires
      # fluentd to be enabled (it scans /var/log/kolla/fluentd/fluentd.log
      # for "following tail of <file>" lines for every service log) and
      # our etc/globals-master.yml sets enable_fluentd: false, so every
      # service log gets flagged as "untailed" and the run is marked
      # critical. Re-enable the script if/when this CI deploys fluentd.
      - name: Run kolla-ansible post-deploy sanity checks
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'set -e
               cd /srv/shakenfist/kerbside-patches/src/kolla-ansible

               echo "::group::tests/check-failure.sh"
               CONTAINER_ENGINE=docker tests/check-failure.sh
               echo "::endgroup::"

               echo "::group::tests/check-config.sh"
               tests/check-config.sh
               echo "::endgroup::"'

      - name: Dump internal VIP CA cert details
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'openssl s_client -showcerts -connect 10.0.2.3:5000'

      - name: Dump CA cert bundle
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo openssl storeutl -noout -text -certs /etc/kolla/certificates/ca/root.crt'

      - name: Verify that the haproxy is configured correctly for the Kerbside API
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'curl -v -k https://10.0.2.3:13002'

      - name: Dump Kerbside API CA cert details
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'openssl s_client -showcerts -connect 10.0.2.3:13002'

      - name: Fetch Kolla-Ansible CA cert and add it to the local system bundle
        if: always()
        run: |
          . $GITHUB_ENV

          echo "Make a copy of the CA certificate available for scp"
          script="sudo cp /etc/kolla/certificates/ca/root.crt /tmp/kolla-ca.pem;"
          script="${script} sudo chown ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /tmp/kolla-ca.pem;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 "${script}"

          echo
          echo "Fetch Kolla-Ansible CA certificate"
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/kolla-ca.pem /tmp/kolla-ca.pem

          echo
          echo "Dump Kolla-Ansible CA certificate"
          echo
          cat /tmp/kolla-ca.pem

          echo
          echo "Trust Kolla-Ansible CA certificate"
          sudo ${GITHUB_WORKSPACE}/kerbside-patches/tools/add-ca-certificate /tmp/kolla-ca.pem

          echo
          echo "Verify we now trust the certificate presented by Horizon"
          unset http_proxy
          unset https_proxy
          unset HTTP_PROXY
          unset HTTPS_PROXY
          curl -v https://10.0.2.3

      - name: Log nova_libvirt qemu and SPICE package inventory
        if: always()
        run: |
          . $GITHUB_ENV
          . ci-environment.sh

          # The nova_libvirt container is what ends up running qemu for
          # guests. When SPICE doesn't work, the usual cause is that the
          # image doesn't actually include a SPICE-enabled qemu-kvm --
          # stock RHEL/Rocky qemu-kvm has SPICE compiled out. Dump the
          # package inventory so post-mortem analysis has a definitive
          # answer without having to rebuild the image.
          for node in ${nodes}; do
              node_address=${!node}

              has_libvirt=$(ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  "sudo docker ps --format '{{.Names}}' | grep -c '^nova_libvirt$' || true")

              if [ "${has_libvirt}" = "0" ]; then
                  echo "::group::${node} at ${node_address} has no nova_libvirt container, skipping"
                  echo "::endgroup::"
                  continue
              fi

              echo "::group::${node} at ${node_address} nova_libvirt package inventory"

              # Detect the package manager (rpm for Rocky, dpkg for
              # Debian/Ubuntu) and dump the qemu/spice/libvirt inventory
              # accordingly. Also log whether qemu reports SPICE support
              # via its help output -- that is the authoritative signal.
              ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  'sudo docker exec nova_libvirt sh -c "
                      if command -v rpm >/dev/null 2>&1; then
                          echo === rpm -qa ===
                          rpm -qa | grep -E \"^(qemu|spice|libvirt)\" | sort
                          echo
                          echo === repo files ===
                          ls -la /etc/yum.repos.d/ 2>/dev/null || true
                      elif command -v dpkg >/dev/null 2>&1; then
                          echo === dpkg -l ===
                          dpkg -l | awk \"/^ii/ && (\\\$2 ~ /^(qemu|spice|libvirt)/) {print \\\$2, \\\$3}\" | sort
                      fi
                      echo
                      echo === qemu -spice help ===
                      qemu-system-x86_64 -spice help 2>&1 | head -20 || echo NO_SPICE_SUPPORT
                  "'

              echo "::endgroup::"
          done

      - name: Attempt to start an instance with a console and connect to it
        run: |
          . $GITHUB_ENV

          mkdir -p /srv/shakenfist
          ln -s ${GITHUB_WORKSPACE}/actions /srv/shakenfist/

          echo "Make a copy of admin-openrc.sh for scp"
          script="sudo cp /etc/kolla/admin-openrc.sh /tmp/admin-openrc.sh;"
          script="${script} sudo chown ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /tmp/admin-openrc.sh;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 "${script}"

          echo
          echo "Fetch admin-openrc.sh"
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/admin-openrc.sh /tmp/admin-openrc.sh

          sed -i 's|/etc/kolla/certificates/ca/root.crt|/tmp/kolla-ca.pem|' /tmp/admin-openrc.sh

          # Prefetch the required image with the proxy
          if [ ! -e /srv/shakenfist/uefi-latency-guest.qcow2 ]; then
              echo
              echo "Downloading test image..."

              wget -q https://images.shakenfist.com/testimages/uefi-latency-guest.qcow2 \
                  -O /srv/shakenfist/uefi-latency-guest.qcow2
              ls -lrth /srv/shakenfist/uefi-latency-guest.qcow2
          fi

          # Disable the proxy for the actual test
          unset http_proxy
          unset https_proxy
          unset HTTP_PROXY
          unset HTTPS_PROXY
          . /tmp/admin-openrc.sh

          echo
          echo "Install client..."
          sudo mkdir -p /srv/openstack-clients
          sudo chown -R debian:debian /srv/openstack-clients

          echo
          echo "Fetch the correct version of the code..."
          # Again I use tar here because of permissions and so forth
          cd /
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "sudo tar czf - /srv/shakenfist/kerbside-patches" | \
              tar xzf -

          cd /srv/shakenfist/kerbside-patches/
          ls -l
          sudo ./tools/install-openstack-clients

          echo
          echo "Images in cloud:"
          openstack image list

          export baseuser=${{ matrix.test.baseuser }}

          echo
          echo "Running config tests..."
          ./tools/test-config

          echo
          echo "Running console tests..."
          CONTAINER_DISTRO="${{ matrix.test.container_distro }}" \
              ./tools/test-console /tmp/kolla-ca.pem

          echo
          echo "Running virtlogd tests..."
          ./tools/test-virtlogd

      - name: Verify containers are healthy
        if: always()
        run: |
          . $GITHUB_ENV
          . ci-environment.sh

          failed=0
          for node in ${nodes}; do
              node_address=${!node}

              echo
              echo "Check docker images on ${node}"
              echo

              ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  "sudo docker ps"
              echo

              unhealthy=$(ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  "sudo docker ps | grep -ci unhealthy || true")
              echo "Unhealthy: ${unhealthy}"
              if [ ${unhealthy} -gt 0 ]; then
                  failed=1
              fi
          done

          if [ ${failed} -gt 0 ]; then
              echo "...detected unhealthy docker containers"
              exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          . $GITHUB_ENV
          . ci-environment.sh

          mkdir -p /tmp/bundle/consoledata

          # NOTE: Console data collection via sf-client has been removed as the
          # CI runner orchestrator already collects this information for us.

          # Step 1: Setup - copy tools to remote nodes
          for node in ${nodes}; do
              node_address=${!node}
              node_start=$(date +%s)
              echo "::group::${node} at ${node_address} - $(date -Iseconds)"

              if [ "${node_address}" != "10.0.2.2" ]; then
                  echo "Setting up remote node..."
                  setup_start=$(date +%s)
                  script="sudo mkdir -p /srv/shakenfist/kerbside-patches"
                  script="${script}; sudo chown -R ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /srv/shakenfist"

                  ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                          -o UserKnownHostsFile=/dev/null \
                          ${{ matrix.test.baseuser }}@${node_address} \
                          "${script}"

                  scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      ${GITHUB_WORKSPACE}/kerbside-patches/tools \
                      ${{ matrix.test.baseuser }}@${node_address}:/srv/shakenfist/kerbside-patches
                  setup_end=$(date +%s)
                  echo "Setup took $((setup_end - setup_start)) seconds"
              fi

              echo
              echo
          done

          # Step 2: Gather logs in parallel on all nodes (10 minute timeout each)
          echo
          echo "Starting parallel log collection..."
          pids=""
          for node in ${nodes}; do
              node_address=${!node}
              echo "Starting gather-logs on ${node} at ${node_address}"

              (
                  timeout 600 ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      ${{ matrix.test.baseuser }}@${node_address} \
                      'cd /srv/shakenfist/kerbside-patches/tools; sudo ./gather-logs' \
                      > /tmp/gather-${node}.log 2>&1
                  echo $? > /tmp/gather-${node}.exitcode
              ) &
              pids="${pids} $!"
          done

          echo "Waiting for all gather-logs processes to complete..."
          wait ${pids}
          echo "All gather-logs processes completed"

          # Step 3: Fetch bundles and extract
          for node in ${nodes}; do
              node_address=${!node}
              echo
              echo "Fetching bundle from ${node} at ${node_address}"

              exitcode=$(cat /tmp/gather-${node}.exitcode 2>/dev/null || echo "unknown")
              if [ "${exitcode}" != "0" ]; then
                  echo "Warning: gather-logs on ${node} exited with code ${exitcode}"
                  cat /tmp/gather-${node}.log || true
              fi

              echo "Running gather-logs (5 minute timeout)..."
              gather_start=$(date +%s)
              timeout 300 ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  'cd /srv/shakenfist/kerbside-patches/tools; sudo ./gather-logs' \
                  2>&1 | tee /tmp/bundle/gather-${node}.log
              gather_exit=$?
              gather_end=$(date +%s)
              echo "gather-logs took $((gather_end - gather_start)) seconds (exit code: ${gather_exit})"

              echo "Fetching bundle..."
              fetch_start=$(date +%s)
              scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address}:/tmp/bundle.zip \
                  /tmp/bundle/${node}.zip || true
              fetch_end=$(date +%s)
              echo "Fetch took $((fetch_end - fetch_start)) seconds"

              if [ -f /tmp/bundle/${node}.zip ]; then
                  echo "Extracting bundle..."
                  mkdir -p /tmp/bundle/${node}
                  cd /tmp/bundle/${node}
                  unzip ../${node}.zip || true
                  rm ../${node}.zip
              else
                  echo "Warning: No bundle.zip received from ${node}"
              fi

              node_end=$(date +%s)
              echo "::endgroup::"
              echo "${node} total: $((node_end - node_start)) seconds"

              echo
              echo
          done

          echo "::group::Building final bundle"
          echo "Building single bundle..."
          cd /tmp/
          zip -r bundle.zip bundle
          echo "::endgroup::"


      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-${{ matrix.test.name }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/bundle.zip

  # The patch tests live in their own reusable workflow and run here so
  # that their result gates the merge like every other lane's. The tier
  # passed down keys the called jobs' concurrency groups, and is merge for
  # a queue entry, smoke for a pull request and the requested tier for a
  # dispatch; local_build passes the same expression. The one secret passed
  # is for the automated lint fixer, which pushes with it; naming it rather
  # than inheriting keeps the called workflow from seeing every other.
  patch_tests:
    name: "Patch tests"
    needs: check_paths
    if: needs.check_paths.outputs.run_patch_tests == 'true'
    uses: ./.github/workflows/rebase-tests.yml
    with:
      tier: >-
        ${{ github.event_name == 'merge_group' && 'merge'
        || github.event_name == 'pull_request' && 'smoke'
        || inputs.tier || 'smoke' }}
      patch_tests: ${{ needs.check_paths.outputs.patch_tests }}
    secrets:
      DAILY_REBASE_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}

  # Builds every image without the CI registry, as a user would on their
  # own machine. It is the only build of the unfiltered image set.
  local_build:
    name: "Local build"
    needs: check_paths
    if: needs.check_paths.outputs.run_local_build == 'true'
    uses: ./.github/workflows/local-container-builds.yml
    with:
      tier: >-
        ${{ github.event_name == 'merge_group' && 'merge'
        || github.event_name == 'pull_request' && 'smoke'
        || inputs.tier || 'smoke' }}

  collect_layer_data:
    name: "Collect layer data and create PR"
    needs: [build_images]
    runs-on: [self-hosted, static]
    # !cancelled() lets this run when some builds failed, so the builds
    # that succeeded still record their layers. When check_paths skipped
    # the builds (a docs-only or data-only change) there is nothing to
    # collect, and the status function would otherwise run it anyway.
    if: >-
      github.event_name == 'pull_request' && !cancelled()
      && needs.build_images.result != 'skipped'
    env:
      DATA_PREFIX: ${{ inputs.data_prefix || 'layers' }}

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DAILY_REBASE_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "build-*"
          path: /tmp/build-artifacts

      - name: Collect layer data and prepare PR
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        # The script switches the working tree to develop, which replaces
        # tools/, so it runs from a copy outside the checkout along with the
        # scripts it calls.
        run: |
          cp tools/collect-layer-data-pr.sh tools/collect-layer-data.py \
              tools/create-data-pr.sh "${RUNNER_TEMP}/"
          "${RUNNER_TEMP}/collect-layer-data-pr.sh"

  # Each collection job needs every gated job directly rather than through
  # another job: a job skipped because its own needs failed reports
  # skipped, which the jq below would pass. They run under always(), not
  # !cancelled(), so that a cancelled run fails its gate rather than
  # skipping it, and the jq passes only success and skipped, so a cancelled
  # dependency fails too. collect_layer_data is deliberately in neither
  # list: it publishes data rather than testing anything.
  can_enqueue:
    name: "Can enqueue"
    needs:
      - check_paths
      - lint
      - assemble_source
      - build_images
      - aggregate_results
      - test_installs
      - patch_tests
      - local_build
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  can_merge:
    name: "Can merge"
    needs:
      - check_paths
      - lint
      - assemble_source
      - build_images
      - aggregate_results
      - test_installs
      - patch_tests
      - local_build
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
