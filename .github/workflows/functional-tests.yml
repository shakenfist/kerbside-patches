name: Build test clouds

on:
  workflow_dispatch:
    inputs:
      data_prefix:
        description: 'Prefix for layer data filenames'
        required: false
        default: 'layers'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - README.md

jobs:
  lint:
    name: "Lint shell scripts and workflows"
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v4

      - name: Configure pip to use local PyPI mirror
        run: |
          mkdir -p ~/.config/pip
          cat > ~/.config/pip/pip.conf <<'PIPCONF'
          [global]
          index-url = https://devpi.home.stillhq.com/root/pypi/+simple/
          PIPCONF

      - name: Install pre-commit and shellcheck
        run: |
          python3 -mvenv pre-commit
          pre-commit/bin/pip3 install pre-commit
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run pre-commit
        run: pre-commit/bin/pre-commit run --all-files

  assemble_source:
    name: "Assemble source for ${{ matrix.test.release }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'release': '2025.1'
          },
          {
            'release': '2025.2'
          },
          {
            'release': 'master'
          },
        ]
    runs-on: [self-hosted, vm, 'debian-12', 'xl']
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-source-${{ matrix.test.release }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v4
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          path: actions
          fetch-depth: 0

      - name: Install dependencies on local runner
        run: |
          . $GITHUB_ENV
          cd kerbside-patches

          ./_build/install-build-dependencies.sh
          ./_build/setup-local-build-environment.sh

      - name: Build patched repositories
        run: |
          . $GITHUB_ENV
          cd kerbside-patches
          ./_build/assemble-source.sh --use-ci-patches ${{ matrix.test.release }}

          # We need a sub directory to make the code more obvious on artifact fetch
          cd src
          mkdir src
          mv ./*.tgz src/

      - uses: actions/upload-artifact@v4
        id: upload_source
        if: success()
        with:
          name: source-${{ matrix.test.release }}
          retention-days: 90
          if-no-files-found: error
          path: kerbside-patches/src

  build_images:
    name: "Images for ${{ matrix.test.release }} on ${{ matrix.test.container_distro }} ${{ matrix.test.container_distro_version }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': 'build-debian-2025.1',
            'release': '2025.1',
            'base': 'debian:12',
            'baseuser': 'debian',
            'container_distro': 'debian',
            'container_distro_version': 'bookworm'
          },
          {
            'name': 'build-debian-2025.2',
            'release': '2025.2',
            'base': 'debian:12',
            'baseuser': 'debian',
            'container_distro': 'debian',
            'container_distro_version': 'bookworm'
          },
          {
            'name': 'build-debian-trixie-master',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian',
            'container_distro': 'debian',
            'container_distro_version': 'trixie'
          },
          {
            'name': 'build-ubuntu-master',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian',
            'container_distro': 'ubuntu',
            'container_distro_version': 'noble'
          },
        ]
    needs: assemble_source
    runs-on: [self-hosted, vm, 'debian-12', 'xl']
    timeout-minutes: 180
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.test.name }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Checkout kerbside-patches
        uses: actions/checkout@v4
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          path: actions
          fetch-depth: 0

      - name: Install dependencies on local runner
        run: |
          . $GITHUB_ENV
          cd kerbside-patches

          ./_build/install-build-dependencies.sh
          ./_build/setup-local-build-environment.sh
          ./_build/add-insecure-ci-registry.sh

          # This is terrible, but its easier than reloading groups
          sudo chmod ugo+rw /var/run/docker.sock

      - name: Dump docker daemon.json
        run: cat /etc/docker/daemon.json

      - name: Ensure CI OCI registry works
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
        run: |
          . $GITHUB_ENV

          echo "Make test image..."
          identifier=$(hostname | sed 's/\..*//')

          echo ${identifier} > identifier
          cat - > Dockerfile <<EOF
          FROM scratch
          COPY identifier identifier
          EOF
          docker build -t heartbeat:latest .

          echo
          echo "Log into regisry..."
          echo ${CI_REGISTRY_TOKEN} | docker login \
              gitlab.home.stillhq.com:5050 --username kolla-imgs --password-stdin

          echo
          echo "Push to registry..."
          docker image tag heartbeat:latest gitlab.home.stillhq.com:5050/openstack/kolla-images/ci_heartbeat:${identifier}
          docker image push gitlab.home.stillhq.com:5050/openstack/kolla-images/ci_heartbeat:${identifier}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-${{ matrix.test.release }}

      - name: Move source to correct location
        run: |
          . $GITHUB_ENV

          echo "Contents of ${GITHUB_WORKSPACE}"
          ls -lrt

          mkdir -p ${GITHUB_WORKSPACE}/kerbside-patches/src
          for item in src/*.tgz; do
              echo "Extracting ${item}"
              tar xzf ${item} -C ${GITHUB_WORKSPACE}/kerbside-patches/src/
          done

          echo
          echo "Contents of ${GITHUB_WORKSPACE}/kerbside-patches/src/"
          ls -lrt ${GITHUB_WORKSPACE}/kerbside-patches/src/

          echo
          echo "Done"

      - name: Build container images
        id: build_images
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
        run: |
          . $GITHUB_ENV
          cd kerbside-patches

          hash=$(./_build/calculate-container-hash.sh \
              kolla kolla-2* \
              nova nova-2* \
              requirements requirements-2* \
              etc src _build tools )

          # I aggressively filter the images built here for performance
          # and reliability reasons in my homelab CI. _All_ images are
          # built in the "ensure local builds" CI jobs to ensure coverage.
          build_regexp="^(base|collectd|cron|dnsmasq|etcd|fluentd"
          build_regexp="${build_regexp}|glance|grafana|hacluster"
          build_regexp="${build_regexp}|haproxy|horizon|httpd|iscsid"
          build_regexp="${build_regexp}|keepalived|kerbside|keystone"
          build_regexp="${build_regexp}|kolla|mariadb|memcached"
          build_regexp="${build_regexp}|multipathd|neutron|nova"
          build_regexp="${build_regexp}|openstack|openvswitch|placement"
          build_regexp="${build_regexp}|prometheus|proxysql|rabbitmq"
          build_regexp="${build_regexp}|telegraf|tgtd|valkey)"

          ./_build/build-containers.sh \
              --use-ci-registry \
              --use-proxy \
              --registry-username kolla-imgs \
              --registry-token "${CI_REGISTRY_TOKEN}" \
              --build-targets "${{ matrix.test.release }}" \
              --build-images "${build_regexp}" \
              --distro ${{ matrix.test.container_distro}} \
              --distro-version ${{ matrix.test.container_distro_version }} \
              --image-tag ${hash} \
              --dont-fetch-images

          echo "image_tag=${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}-${hash}" >> ${GITHUB_OUTPUT}

      - name: Dump build.json
        if: always()
        run: |
          . $GITHUB_ENV
          if [ -e kerbside-patches/archive/build.json ]; then
              python3 -m json.tool < kerbside-patches/archive/build.json
          else
              echo "File not found"
          fi

      - name: Dump layer data summary
        if: always()
        run: |
          . $GITHUB_ENV
          if [ -d kerbside-patches/archive/layers ]; then
              echo "Layer data files:"
              ls -lh kerbside-patches/archive/layers/
              echo
              echo "Line counts:"
              wc -l kerbside-patches/archive/layers/*.jsonl 2>/dev/null || echo "No JSONL files"
          else
              echo "No layer data directory found"
          fi

      - name: Collect Docker daemon diagnostics
        if: always()
        run: |
          . $GITHUB_ENV
          clingwrap gather \
              --target openstack-kolla-ansible \
              --output /tmp/clingwrap-bundle.zip

      # We have the output of the build job and its config, regardless of success or failure
      - name: Archive build config and logs
        if: always()
        run: |
          . $GITHUB_ENV

          # Not all these files will exist if the build above was skipped because the images
          # already exist
          archive_path="/tmp/${{ matrix.test.name }}"
          mkdir ${archive_path}

          echo ${{ steps.build_images.outputs.image_tag }} > ${archive_path}/image_tag

          # Record the run attempt so collect_layer_data can filter out stale artifacts
          # from previous attempts when a single job is retried
          echo "${{ github.run_attempt }}" > ${archive_path}/run_attempt

          if [ -e /tmp/clingwrap-bundle.zip ]; then
              cp /tmp/clingwrap-bundle.zip ${archive_path}/
          fi

          if [ -e kerbside-patches/archive/build.log ]; then
              cp kerbside-patches/archive/build.log ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/build.json ]; then
              cp kerbside-patches/archive/build.json ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/layers.tar.gz ]; then
              cp kerbside-patches/archive/layers.tar.gz ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/kolla-build.conf ]; then
              cp kerbside-patches/archive/kolla-build.conf ${archive_path}/
          fi
          if [ -e kerbside-patches/archive/occystrap-layer-cache.json ]; then
              cp kerbside-patches/archive/occystrap-layer-cache.json ${archive_path}/
          fi

          # System details for debugging
          docker info > ${archive_path}/docker-info.txt
          if [ -e /etc/docker/daemon.json ]; then
              cp /etc/docker/daemon.json ${archive_path}/
          else
              echo "No daemon.json found" > ${archive_path}/daemon.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test.name }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/${{ matrix.test.name }}

      # This works around the limited support in Github Actions for outputs from matrices
      - name: Write outputs to a temporary file
        if: success()
        run: |
          echo "{" \
              "\"release\": \"${{ matrix.test.release }}\"," \
              "\"image_tag\": \"${{ steps.build_images.outputs.image_tag }}\"" \
              "}" >> /tmp/result.json

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: buildresult-${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}
          retention-days: 14
          if-no-files-found: error
          path: /tmp/result.json

  aggregate_results:
    name: "Aggregate results"
    needs: build_images
    runs-on: [self-hosted, vm, 'debian-12', 'm']
    outputs:
      all_results: ${{ steps.combine.outputs.results }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: buildresult-*

      - name: Combine results and expose as an output
        id: combine
        run: |
          # Collect all results into a JSON array
          results="["
          for dir in buildresult-*/; do
            value=$(cat "${dir}result.json")
            results="${results}${value},"
          done

          # Terminate array and remove trailing comma
          results="${results%,}]"
          echo "results=${results}" >> $GITHUB_OUTPUT

  test_installs:
    name: "${{ matrix.test.description }} using ${{ matrix.test.container_distro }} containers"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': '2025.1-h-debian12-c-debian12-aio',
            'description': '2025.1 debian 12 images on debian 12 all-in-one',
            'release': '2025.1',
            'base': 'debian:12',
            'baseuser': 'debian',
            'topology': 'all-in-one',
            'runs_on': 'debian-12',
            'container_distro': 'debian',
            'container_distro_version': 'bookworm',
            'enable_kerbside': 'true'
          },
          {
            'name': '2025.2-h-debian12-c-debian12-aio',
            'description': '2025.2 debian 12 images on debian 12 all-in-one',
            'release': '2025.2',
            'base': 'debian:12',
            'baseuser': 'debian',
            'topology': 'all-in-one',
            'runs_on': 'debian-12',
            'container_distro': 'debian',
            'container_distro_version': 'bookworm',
            'enable_kerbside': 'true'
          },
          {
            'name': 'master-h-debian12-c-ubuntu2404-aio',
            'description': 'master ubuntu 24.04 images on debian 12 all-in-one',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian',
            'topology': 'all-in-one',
            'runs_on': 'debian-12',
            'container_distro': 'ubuntu',
            'container_distro_version': 'noble',
            'enable_kerbside': 'true'
          },
          {
            'name': 'master-h-debian12-c-debian13-aio-nokerbside',
            'description': 'master debian 13 images on debian 12 all-in-one with no kerbside',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian',
            'topology': 'all-in-one',
            'runs_on': 'debian-12',
            'container_distro': 'debian',
            'container_distro_version': 'trixie',
            'enable_kerbside': 'false'
          },
          {
            'name': 'master-h-debian12-c-debian12-aio',
            'description': 'master debian 13 images on debian 12 all-in-one',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian',
            'topology': 'all-in-one',
            'runs_on': 'debian-12',
            'container_distro': 'debian',
            'container_distro_version': 'trixie'
          },
          {
            'name': 'master-h-rocky10-c-debian-13-aio',
            'description': 'master debian 13 images on rocky 10 all-in-one',
            'release': 'master',
            'base': 'rocky:10',
            'baseuser': 'cloud-user',
            'topology': 'all-in-one',
            'runs_on': 'debian-12',
            'container_distro': 'debian',
            'container_distro_version': 'trixie'
          },
          {
            'name': 'master-h-debian12-c-debian12-multi',
            'description': 'master debian 13 images on debian 12 multinode',
            'release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian',
            'topology': 'multinode-2',
            'runs_on': 'debian-12',
            'container_distro': 'debian',
            'container_distro_version': 'trixie'
          },
        ]
    runs-on: [self-hosted, vm, '${{ matrix.test.runs_on }}']
    needs: [build_images, aggregate_results]
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.test.name }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Make /srv/shakenfist
        run: |
          sudo mkdir /srv/shakenfist
          sudo chown debian:debian /srv/shakenfist

      - name: Checkout the actions repository
        uses: actions/checkout@v4
        with:
          repository: shakenfist/actions
          path: actions
          fetch-depth: 0

      - name: Download relevant build results
        uses: actions/download-artifact@v4
        with:
          pattern: "buildresult-${{ matrix.test.release }}-${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}*"

      - name: Log incoming results
        id: incoming
        run: |
          echo "State of workspace:"
          ls -lrt

          echo
          echo "Results from image build step:"
          echo '${{ needs.aggregate_results.outputs.all_results }}' | python3 -m json.tool

          echo
          distro_ver="${{ matrix.test.container_distro }}-${{ matrix.test.container_distro_version }}"
          echo "Distro version is: ${distro_ver}"

          echo
          echo "Results specific to this job:"
          cat buildresult-${{ matrix.test.release }}-${distro_ver}/result.json | python3 -m json.tool

          echo
          echo "Export results specific to this job..."
          image_tag=$(cat buildresult-${{ matrix.test.release }}-${distro_ver}/result.json | jq -r .image_tag)
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT
          echo "    image_tag is ${image_tag}"

      - name: Setup test environment
        uses: shakenfist/actions/setup-kerbside-environment@main
        with:
          base: ${{ matrix.test.base }}
          base_user: ${{ matrix.test.baseuser }}
          openstack_release: ${{ matrix.test.release }}
          topology: ${{ matrix.test.topology }}

      - name: Dump CI environment details
        run: |
          cat ci-environment.sh

      - name: Log getent resolution for kolla
        if: "contains(matrix.test.topology, 'all-in-one')"
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo getent ahostsv4 kolla'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-${{ matrix.test.release }}

      - name: Move source to correct location
        run: |
          . $GITHUB_ENV

          echo "Contents of ${GITHUB_WORKSPACE}"
          ls -lrt

          mkdir -p ${GITHUB_WORKSPACE}/kerbside-patches/src
          for item in src/*.tgz; do
              echo "Extracting ${item}"
              tar xzf ${item} -C ${GITHUB_WORKSPACE}/kerbside-patches/src/
          done

          echo
          echo "Contents of ${GITHUB_WORKSPACE}/kerbside-patches/src/"
          ls -lrt ${GITHUB_WORKSPACE}/kerbside-patches/src/

          echo
          echo "Done"

          echo
          echo "Copy source to target node..."

          # I use tar here because some of the entries are symlinks
          cd ${GITHUB_WORKSPACE}/kerbside-patches
          tar czf - src | ssh -i /srv/github/id_ci \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "cd /srv/shakenfist/kerbside-patches && tar xzf -"

      - name: Deploy Kolla-Ansible
        uses: shakenfist/actions/deploy-kolla-ansible@main
        with:
          base_user: ${{ matrix.test.baseuser }}
          image_tag: ${{ steps.incoming.outputs.image_tag }}
          build_targets: ${{ matrix.test.release }}
          topology: ${{ matrix.test.topology }}
          registry_token: ${{ secrets.CI_REGISTRY_TOKEN }}
          enable_kerbside: ${{ matrix.test.enable_kerbside }}
          use_ci_registry: 'true'

      - name: Dump internal VIP CA cert details
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'openssl s_client -showcerts -connect 10.0.2.3:5000'

      - name: Dump CA cert bundle
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo openssl storeutl -noout -text -certs /etc/kolla/certificates/ca/root.crt'

      - name: Verify that the haproxy is configured correctly for the Kerbside API
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'curl -v -k https://10.0.2.3:13002'

      - name: Dump Kerbside API CA cert details
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'openssl s_client -showcerts -connect 10.0.2.3:13002'

      - name: Fetch Kolla-Ansible CA cert and add it to the local system bundle
        if: always()
        run: |
          . $GITHUB_ENV

          echo "Make a copy of the CA certificate available for scp"
          script="sudo cp /etc/kolla/certificates/ca/root.crt /tmp/kolla-ca.pem;"
          script="${script} sudo chown ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /tmp/kolla-ca.pem;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 "${script}"

          echo
          echo "Fetch Kolla-Ansible CA certificate"
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/kolla-ca.pem /tmp/kolla-ca.pem

          echo
          echo "Dump Kolla-Ansible CA certificate"
          echo
          cat /tmp/kolla-ca.pem

          echo
          echo "Trust Kolla-Ansible CA certificate"
          sudo ${GITHUB_WORKSPACE}/kerbside-patches/tools/add-ca-certificate /tmp/kolla-ca.pem

          echo
          echo "Verify we now trust the certificate presented by Horizon"
          unset http_proxy
          unset https_proxy
          unset HTTP_PROXY
          unset HTTPS_PROXY
          curl -v https://10.0.2.3

      - name: Attempt to start an instance with a console and connect to it
        run: |
          . $GITHUB_ENV

          mkdir -p /srv/shakenfist
          ln -s ${GITHUB_WORKSPACE}/actions /srv/shakenfist/

          echo "Make a copy of admin-openrc.sh for scp"
          script="sudo cp /etc/kolla/admin-openrc.sh /tmp/admin-openrc.sh;"
          script="${script} sudo chown ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /tmp/admin-openrc.sh;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 "${script}"

          echo
          echo "Fetch admin-openrc.sh"
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/admin-openrc.sh /tmp/admin-openrc.sh

          sed -i 's|/etc/kolla/certificates/ca/root.crt|/tmp/kolla-ca.pem|' /tmp/admin-openrc.sh

          # Prefetch the required image with the proxy
          if [ ! -e /srv/shakenfist/uefi-latency-guest.qcow2 ]; then
              echo
              echo "Downloading test image..."

              wget -q https://images.shakenfist.com/testimages/uefi-latency-guest.qcow2 \
                  -O /srv/shakenfist/uefi-latency-guest.qcow2
              ls -lrth /srv/shakenfist/uefi-latency-guest.qcow2
          fi

          # Disable the proxy for the actual test
          unset http_proxy
          unset https_proxy
          unset HTTP_PROXY
          unset HTTPS_PROXY
          . /tmp/admin-openrc.sh

          echo
          echo "Install client..."
          sudo mkdir -p /srv/kolla-ansible
          sudo chown -R debian:debian /srv/kolla-ansible
          python3 -mvenv /srv/kolla-ansible/venv

          echo
          echo "Fetch the correct version of the code..."
          # Again I use tar here because of permissions and so forth
          cd /
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "sudo tar czf - /srv/shakenfist/kerbside-patches" | \
              tar xzf -

          cd /srv/shakenfist/kerbside-patches/
          ls -l
          sudo ./tools/install-openstack-clients

          echo
          echo "Images in cloud:"
          openstack image list

          export baseuser=${{ matrix.test.baseuser }}

          echo
          echo "Running config tests..."
          ./tools/test-config

          echo
          echo "Running console tests..."
          ./tools/test-console /tmp/kolla-ca.pem

      - name: Verify containers are healthy
        if: always()
        run: |
          . $GITHUB_ENV
          . ci-environment.sh

          failed=0
          for node in ${nodes}; do
              node_address=${!node}

              echo
              echo "Check docker images on ${node}"
              echo

              ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  "sudo docker ps"
              echo

              unhealthy=$(ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  "sudo docker ps | grep -ci unhealthy || true")
              echo "Unhealthy: ${unhealthy}"
              if [ ${unhealthy} -gt 0 ]; then
                  failed=1
              fi
          done

          if [ ${failed} -gt 0 ]; then
              echo "...detected unhealthy docker containers"
              exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          . $GITHUB_ENV
          . ci-environment.sh

          mkdir -p /tmp/bundle/consoledata

          # NOTE: Console data collection via sf-client has been removed as the
          # CI runner orchestrator already collects this information for us.

          # Phase 1: Setup - copy tools to remote nodes
          for node in ${nodes}; do
              node_address=${!node}
              node_start=$(date +%s)
              echo "::group::${node} at ${node_address} - $(date -Iseconds)"

              if [ "${node_address}" != "10.0.2.2" ]; then
                  echo "Setting up remote node..."
                  setup_start=$(date +%s)
                  script="sudo mkdir -p /srv/shakenfist/kerbside-patches"
                  script="${script}; sudo chown -R ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /srv/shakenfist"

                  ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                          -o UserKnownHostsFile=/dev/null \
                          ${{ matrix.test.baseuser }}@${node_address} \
                          "${script}"

                  scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      ${GITHUB_WORKSPACE}/kerbside-patches/tools \
                      ${{ matrix.test.baseuser }}@${node_address}:/srv/shakenfist/kerbside-patches
                  setup_end=$(date +%s)
                  echo "Setup took $((setup_end - setup_start)) seconds"
              fi

              echo
              echo
          done

          # Phase 2: Gather logs in parallel on all nodes (10 minute timeout each)
          echo
          echo "Starting parallel log collection..."
          pids=""
          for node in ${nodes}; do
              node_address=${!node}
              echo "Starting gather-logs on ${node} at ${node_address}"

              (
                  timeout 600 ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      ${{ matrix.test.baseuser }}@${node_address} \
                      'cd /srv/shakenfist/kerbside-patches/tools; sudo ./gather-logs' \
                      > /tmp/gather-${node}.log 2>&1
                  echo $? > /tmp/gather-${node}.exitcode
              ) &
              pids="${pids} $!"
          done

          echo "Waiting for all gather-logs processes to complete..."
          wait ${pids}
          echo "All gather-logs processes completed"

          # Phase 3: Fetch bundles and extract
          for node in ${nodes}; do
              node_address=${!node}
              echo
              echo "Fetching bundle from ${node} at ${node_address}"

              exitcode=$(cat /tmp/gather-${node}.exitcode 2>/dev/null || echo "unknown")
              if [ "${exitcode}" != "0" ]; then
                  echo "Warning: gather-logs on ${node} exited with code ${exitcode}"
                  cat /tmp/gather-${node}.log || true
              fi

              echo "Running gather-logs (5 minute timeout)..."
              gather_start=$(date +%s)
              timeout 300 ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address} \
                  'cd /srv/shakenfist/kerbside-patches/tools; sudo ./gather-logs' \
                  2>&1 | tee /tmp/bundle/gather-${node}.log
              gather_exit=$?
              gather_end=$(date +%s)
              echo "gather-logs took $((gather_end - gather_start)) seconds (exit code: ${gather_exit})"

              echo "Fetching bundle..."
              fetch_start=$(date +%s)
              scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.test.baseuser }}@${node_address}:/tmp/bundle.zip \
                  /tmp/bundle/${node}.zip || true
              fetch_end=$(date +%s)
              echo "Fetch took $((fetch_end - fetch_start)) seconds"

              if [ -f /tmp/bundle/${node}.zip ]; then
                  echo "Extracting bundle..."
                  mkdir -p /tmp/bundle/${node}
                  cd /tmp/bundle/${node}
                  unzip ../${node}.zip || true
                  rm ../${node}.zip
              else
                  echo "Warning: No bundle.zip received from ${node}"
              fi

              node_end=$(date +%s)
              echo "::endgroup::"
              echo "${node} total: $((node_end - node_start)) seconds"

              echo
              echo
          done

          echo "::group::Building final bundle"
          echo "Building single bundle..."
          cd /tmp/
          zip -r bundle.zip bundle
          echo "::endgroup::"


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.test.name }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/bundle.zip

  collect_layer_data:
    name: "Collect layer data and create PR"
    needs: [build_images]
    runs-on: [self-hosted, static]
    if: github.event_name == 'pull_request' && !cancelled()
    env:
      DATA_PREFIX: ${{ inputs.data_prefix || 'layers' }}

    steps:
      - name: Set environment variables
        run: |
          {
            echo "DATESTAMP=$(date '+%Y%m%d-%H%M')"
            echo "RUN_ID=${{ github.run_id }}"
          } >> $GITHUB_ENV

      - name: Checkout kerbside-patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DAILY_REBASE_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "build-*"
          path: /tmp/build-artifacts

      - name: Collect layer data and prepare PR
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "Available artifacts:"
          ls -la /tmp/build-artifacts/ || echo "No artifacts directory"
          echo
          echo "Current run attempt: ${CURRENT_ATTEMPT}"

          # Filter artifacts to only include those from the current run attempt.
          # This prevents including stale layer data from previous attempts when
          # a single matrix job is retried.
          included_builds=""
          excluded_builds=""
          NL=$'\n'

          for dir in /tmp/build-artifacts/build-*/; do
              build_name=$(basename "${dir}")

              # Check if this artifact was generated in the current attempt
              if [ -f "${dir}run_attempt" ]; then
                  artifact_attempt=$(cat "${dir}run_attempt")
                  if [ "${artifact_attempt}" != "${CURRENT_ATTEMPT}" ]; then
                      echo "Skipping ${build_name}: from attempt ${artifact_attempt}, current is ${CURRENT_ATTEMPT}"
                      excluded_builds="${excluded_builds}- ${build_name} (attempt ${artifact_attempt})${NL}"
                      continue
                  fi
              else
                  echo "Skipping ${build_name}: no run_attempt file (legacy artifact)"
                  excluded_builds="${excluded_builds}- ${build_name} (no attempt marker)${NL}"
                  continue
              fi

              if [ -f "${dir}layers.tar.gz" ]; then
                  included_builds="${included_builds}- ${build_name}${NL}"
              fi
          done

          # Check if we have any layers to include
          if [ -z "${included_builds}" ]; then
              echo "No layers.tar.gz files from current attempt found, skipping PR creation"
              exit 0
          fi

          echo
          echo "Builds to include:"
          echo "${included_builds}"
          if [ -n "${excluded_builds}" ]; then
              echo "Builds excluded (from previous attempts):"
              echo "${excluded_builds}"
          fi

          # Create a branch for the layer data (include run_id for uniqueness)
          branch_name="${DATA_PREFIX}-data-${DATESTAMP}-run${RUN_ID}"
          git checkout develop
          git checkout -b "${branch_name}"

          # Ensure data/ exists
          mkdir data

          # Copy layer tarballs with unique names (only from current attempt)
          mkdir -p data
          for dir in /tmp/build-artifacts/build-*/; do
              # Re-check run_attempt filter
              if [ -f "${dir}run_attempt" ]; then
                  artifact_attempt=$(cat "${dir}run_attempt")
                  if [ "${artifact_attempt}" != "${CURRENT_ATTEMPT}" ]; then
                      continue
                  fi
              else
                  continue
              fi

              if [ -f "${dir}layers.tar.gz" ]; then
                  build_name=$(basename "${dir}")
                  dest_name="${DATA_PREFIX}-${DATESTAMP}-run${RUN_ID}-${build_name}.tar.gz"

                  echo "Copying ${dir}layers.tar.gz to data/${dest_name}"
                  cp "${dir}layers.tar.gz" "data/${dest_name}"
              fi
          done

          # Check if there are changes to commit
          if [ -z "$(git status --porcelain data/)" ]; then
              echo "No changes to commit"
              exit 0
          fi

          # Configure git and commit
          git config --global user.name "shakenfist-bot"
          git config --global user.email "bot@shakenfist.com"

          git add data/
          git commit -m "Add layer data from build run ${RUN_ID}.

          This commit adds layer data from a successful functional
          test build. This data is collected for analysis purposes.

          Source PR: #${PR_NUMBER}
          Build date: ${DATESTAMP}
          Run ID: ${RUN_ID}
          Run attempt: ${CURRENT_ATTEMPT}

          Assisted-By: CI Automation
          Co-Authored-By: shakenfist-bot <bot@shakenfist.com>"

          # Push the branch
          git push -f origin "${branch_name}"
          sleep 5

          # Build PR body with explanation of included/excluded builds
          pr_body="This PR adds layer data collected from build run ${RUN_ID}.

          **Source:** PR #${PR_NUMBER} - ${PR_TITLE}
          **Build date:** ${DATESTAMP}
          **Run ID:** ${RUN_ID}
          **Run attempt:** ${CURRENT_ATTEMPT}

          ### Builds included

          ${included_builds}

          These builds completed in the current workflow run attempt."

          if [ -n "${excluded_builds}" ]; then
              pr_body="${pr_body}

          ### Builds excluded

          ${excluded_builds}
          
          These builds were from previous run attempts (e.g., cached artifacts from
          before a job retry). Their layer data was not included to avoid duplicating
          data that was already collected in earlier PRs."
          fi

          gh pr create \
              --assignee mikalstill \
              --title "${DATA_PREFIX} data from ${DATESTAMP} (run ${RUN_ID}, attempt ${CURRENT_ATTEMPT})" \
              --body "${pr_body}" \
              --head "${branch_name}"

          echo "Pull request created."
