name: Runner smoke test

# On-demand check that a given VM runner (OS + size) provisions, registers
# and runs a job. The conductor (shakenfist/private-ci) only launches
# runners in response to queued jobs, so dispatching this is also how you
# "force" a particular OS/size to be built -- handy for validating a new
# CI image such as rocky-9.
#
# NOTE: workflow_dispatch only works once this file is on the default
# branch (develop). Trigger with, e.g.:
#   gh workflow run runner-smoke-test.yml --ref develop -f os=rocky-9 -f size=xl

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS label (e.g. debian-12, rocky-9)'
        required: true
        default: 'rocky-9'
      size:
        description: 'Runner size (xs, s, m, l, xl)'
        required: true
        default: 'xl'

jobs:
  smoke:
    name: "Smoke test ${{ inputs.os }} ${{ inputs.size }}"
    runs-on: [self-hosted, vm, '${{ inputs.os }}', '${{ inputs.size }}']
    timeout-minutes: 30

    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Report runner environment
        run: |
          set -x
          cat /etc/os-release
          echo "user: $(whoami)"
          id
          echo "home: ${HOME}"
          if sudo -n true 2>/dev/null; then
            echo "passwordless sudo: OK"
          else
            echo "passwordless sudo: MISSING"
          fi
          python3 --version || true
          for tool in apt-get dnf git jq ansible tox yq; do
            printf '%-10s ' "${tool}:"
            command -v "${tool}" || echo "(absent)"
          done

      - name: Checkout kerbside-patches
        uses: actions/checkout@v4
        with:
          path: kerbside-patches
          fetch-depth: 1

      - name: Confirm checkout and workspace are usable
        run: |
          test -e kerbside-patches/buildall.sh && echo "checkout OK"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
