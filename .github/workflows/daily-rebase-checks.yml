name: Ensure patches still apply once a day

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'   # utc

jobs:
  daily-rebase:
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Set environment variables
        run: |
          {
            echo "SF_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
            echo "SHAKENFIST_NAMESPACE=$(hostname)"
            echo "DATESTAMP=$(date '+%Y%m%d')"
            echo "DATEPRETTY=$(date '+%-d %B %Y')"
          } >> $GITHUB_ENV

      - name: Checkout kerbside-patches
        uses: actions/checkout@v7
        with:
          path: kerbside-patches
          fetch-depth: 0

      - name: Create rebase branch and bump SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches

          git checkout -b daily-rebase-${DATESTAMP}

          # Bump the description in README.md
          sed "s/%%date%%/${DATEPRETTY}/" README.md.tmpl > README.md

          # Lock in new daily SHAs
          _build/bump-source-shas.sh 1 \
              --changelog ${GITHUB_WORKSPACE}/sha-changelog.txt

          echo
          echo "Changes..."
          git diff
          echo

          echo "Commit changes..."
          git config --global user.name "shakenfist-bot"
          git config --global user.email "bot@shakenfist.com"
          git commit -a -m "Daily rebase for ${DATESTAMP}."

      - name: Test patches and attempt fixes with Claude
        id: rebase
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches

          # Run the rebase helper script (same script used for CLI)
          # It will test patches, analyze failures, and invoke Claude if needed
          set +e
          ./_build/rebase-with-claude.sh \
              --ci \
              --output-dir ${GITHUB_WORKSPACE}/rebase-output \
              2>&1 | tee ${GITHUB_WORKSPACE}/rebase-log.txt
          rebase_exit_code=$?
          set -e

          # Parse the CI output for GitHub Actions
          if grep -q "patches_failed=true" ${GITHUB_WORKSPACE}/rebase-log.txt; then
            echo "patches_failed=true" >> $GITHUB_OUTPUT
          else
            echo "patches_failed=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "fix_succeeded=true" ${GITHUB_WORKSPACE}/rebase-log.txt; then
            echo "fix_succeeded=true" >> $GITHUB_OUTPUT
          else
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "claude_available=true" ${GITHUB_WORKSPACE}/rebase-log.txt; then
            echo "claude_available=true" >> $GITHUB_OUTPUT
          else
            echo "claude_available=false" >> $GITHUB_OUTPUT
          fi

          exit ${rebase_exit_code}

      - name: Commit Claude's patch fixes
        if: |
          steps.rebase.outputs.patches_failed == 'true' &&
          steps.rebase.outputs.fix_succeeded == 'true'
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches

          # Check if there are changes to commit (patches or ORDER files)
          if [ -n "$(git status --porcelain _patches/ ./*/ORDER)" ]; then
            git add _patches/ ./*/ORDER
            git commit -m "Auto-fix patches for daily rebase ${DATESTAMP}.

            Claude Code automatically updated patches that failed to apply
            after upstream SHA bump.

            Assisted-By: Claude Code
            Co-Authored-By: Claude <noreply@anthropic.com>"
          fi

      - name: Push branch and create PR
        env:
          GITHUB_TOKEN: ${{ secrets.DAILY_REBASE_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}/kerbside-patches

          git push -f origin daily-rebase-${DATESTAMP}
          sleep 10

          # Build upstream changes summary
          changelog=""
          if [ -s ${GITHUB_WORKSPACE}/sha-changelog.txt ]; then
            changelog="

          **Upstream changes:**
          \`\`\`
          $(cat ${GITHUB_WORKSPACE}/sha-changelog.txt)
          \`\`\`"
          fi

          # Determine PR body based on what happened
          if [ "${{ steps.rebase.outputs.patches_failed }}" == "true" ]; then
            if [ "${{ steps.rebase.outputs.fix_succeeded }}" == "true" ]; then
              pr_body="A daily rebase was attempted.

          **Note:** Some patches failed to apply with the new upstream SHAs.
          Claude Code automatically fixed the patches.

          Please review the patch changes carefully before merging.${changelog}"
            else
              pr_body="A daily rebase was attempted.

          **Warning:** Some patches failed to apply and Claude Code was
          unable to fix them automatically. Manual intervention is required.

          See the workflow logs for details about which patches failed.${changelog}"
            fi
          else
            pr_body="A daily rebase was attempted. All patches applied successfully.${changelog}"
          fi

          echo "Create a PR..."
          gh pr create \
              --assignee mikalstill \
              --reviewer mikalstill \
              --title "Daily rebase for ${DATESTAMP}." \
              --body "${pr_body}" \
              --head $(git branch --show-current)
          echo
          echo "Pull request created."

      - name: Create issue for unfixable patches
        if: |
          steps.rebase.outputs.patches_failed == 'true' &&
          (steps.rebase.outputs.claude_available != 'true' ||
           steps.rebase.outputs.fix_succeeded == 'false')
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DAILY_REBASE_TOKEN }}
          script: |
            const fs = require('fs');
            const failuresPath = process.env.GITHUB_WORKSPACE + '/rebase-output/patch-failures.txt';
            let failures = 'See workflow logs for details.';
            try {
              failures = fs.readFileSync(failuresPath, 'utf8');
            } catch (e) {
              console.log('Could not read failures file:', e);
            }

            const claudeAvailable = '${{ steps.rebase.outputs.claude_available }}' === 'true';
            const reason = claudeAvailable
              ? 'Claude Code was unable to fix them automatically'
              : 'Claude Code CLI was not available on the runner';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily rebase failed: patches need manual attention (${process.env.DATESTAMP})`,
              body: `The daily rebase workflow detected failing patches. ${reason}.

            **Failed patches:**
            \`\`\`
            ${failures}
            \`\`\`

            Please review and fix manually. The daily rebase PR has been created but will fail CI until patches are fixed.

            See [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['rebase-failure', 'needs-attention']
            });
