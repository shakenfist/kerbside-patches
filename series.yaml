# The patch series in this repository. tools/series.py documents the format,
# and tools/check-series-index.py checks it against the series directories.
#
# There is more than one "patch epic" expressed in the repository at the
# moment, so this is how they link together (or not).

ansible-collection-kolla:
  ansible-collection-kolla:
    status: carry

devstack:
  devstack-privsep-memory-001:
    description: Fix memory usage measurements
    upstream: https://review.opendev.org/c/openstack/devstack/+/1011786
    status: push

futurist:
  futurist-import-memory-004:
    description: Reduce imports to reduce memory usage
    upstream: https://review.opendev.org/c/openstack/futurist/+/1012147
    status: push
    after: [devstack-privsep-memory-001]

keystone:
  keystone-import-memory-008:
    description: Reduce imports to reduce memory usage
    upstream: https://review.opendev.org/c/openstack/keystone/+/1012171
    status: push
    after: [devstack-privsep-memory-001]

kolla:
  kolla:
    description: Internal series carrying all kolla patches
    upstream: None
    status: carry

  # Features
  kolla-deployer:
    description: Containerized kolla-ansible deployer
    upstream: https://review.opendev.org/c/openstack/kolla/+/1011443
    status: push
  kolla-kerbside:
    description: Deploy Kerbside with Kolla-ansible
    upstream: https://review.opendev.org/c/openstack/kolla/+/998073
    status: push

  # Fixes
  kolla-magnum-setuptools-pin:
    description: CI flake fix
    upstream: https://review.opendev.org/c/openstack/kolla/+/1007307
    status: push
  kolla-virtlogd-fail-loudly:
    description: Bug fix
    upstream: https://review.opendev.org/c/openstack/kolla/+/1010516
    status: push
    after: [kolla-ansible-fluentd-virtlogd]

kolla-ansible:
  kolla-ansible:
    description: Internal series carrying all kolla-ansible patches
    upstream: None
    status: carry

  # Features
  kolla-ansible-deployer:
    description: Containerized kolla-ansible deployer
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/1011940
    status: push
    after: [kolla-deployer]
  kolla-ansible-json-logging:
    description: JSON logging follow on for Kerbside deployment
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/1005459
    status: push
    after: [kolla-ansible-kerbside]
  kolla-ansible-kerbside:
    description: Deploy Kerbside with Kolla-Ansible
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/976889
    status: push

  # Fixes
  kolla-ansible-fluentd-patience:
    description: CI flake fix
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/1001633
    status: push
  kolla-ansible-fluentd-virtlogd:
    description: Bug fix
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/1010517
    status: push
  kolla-ansible-host-virtlogd-precheck:
    description: Bug fix
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/1010517
    status: push
  kolla-ansible-mariadb-collations:
    description: CI flake fix
    upstream: https://review.opendev.org/c/openstack/kolla-ansible/+/1007308
    status: push

neutron:
  # General neutron agent improvements
  neutron-timecost-fix:
    description: Generate a timecost call id for every call
    upstream: https://review.opendev.org/c/openstack/neutron/+/1009882
    status: push
  neutron-import-time-config-check:
    description: Config should not be read at import time
    upstream: https://review.opendev.org/c/openstack/neutron/+/1012623
    status: push
  neutron-dhcp-agent-fixes:
    description: Various bug fixes and mypy guards against regressions
    upstream: https://review.opendev.org/c/openstack/neutron/+/1012616
    status: push
  neutron-dvr-fip-ns-locking:
    description: DVR lock correctness
    upstream: https://review.opendev.org/c/openstack/neutron/+/1012621
    status: push
  neutron-test-switch-interval:
    description: Shake out locking bugs by task switching harder
    upstream: https://review.opendev.org/c/openstack/neutron/+/1012625
    status: push

  # Neutron memory usage
  neutron-db-api-import-memory-013:
    description: Cleanup imports which are not universally used
    upstream: https://review.opendev.org/c/openstack/neutron/+/1012182
    status: push
    after: [devstack-privsep-memory-001]
  neutron-import-memory-007:
    description: OVS agent memory usage cleanups
    upstream: https://review.opendev.org/c/openstack/neutron/+/1012169
    status: push
    after: [devstack-privsep-memory-001]
  neutron-privsep-memory-003:
    description: privsep memory usage cleanups
    upstream: https://review.opendev.org/c/openstack/neutron/+/1011796
    status: push
    after: [devstack-privsep-memory-001]

  # Incomplete and not yet pushed
  neutron-agent-typing-base:
    description: Start adding mypy for neutron OVS agents
    upstream: None
    status: carry

neutron-lib:
  neutron-lib-db-api-import-memory-006:
    description: Load the DB API only for DB users
    upstream: https://review.opendev.org/c/openstack/neutron-lib/+/1012152
    status: push
    after: [devstack-privsep-memory-001]
  neutron-lib-import-memory-005:
    description: Import os_ken only when validating an ethertype
    upstream: https://review.opendev.org/c/openstack/neutron-lib/+/1012151
    status: push
    after: [devstack-privsep-memory-001]

