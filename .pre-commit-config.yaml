repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(_build/|tools/|upstream/)
        types_or: [sh, bash, shell]
        args: ['-x']
      - id: shellcheck
        name: shellcheck (extensionless scripts)
        files: ^(_build/|tools/|upstream/)[^/.]+$
        types: [text]
        exclude: '(spice-connect\.py|extract-commit-message|summarize_layers\.py|analyze-shared-patches\.py|analyze-gerrit-new-roles|analyze-gerrit-patch-size|analyze-gerrit-review-times|gerrit-pre-push-lint|write-build-manifest|measure-deployer-bootstrap)$'
        args: ['-x']

  # skillsaw lints the agent context in this repository -- AGENTS.md
  # and the skills under .claude/ -- for malformed skills,
  # smuggled unicode and pasted credentials. The rev is kept current by
  # renovate's pre-commit manager.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.21.0
    hooks:
      - id: skillsaw

  # Hand editing a patch in _patches/ means keeping the @@ hunk headers in
  # step with the body. A header that is too large makes git reject the
  # patch; one that is too small is worse, because git silently truncates
  # the hunk and applies the wrong content. recount-patch.py --check
  # catches both. Run it without --check to see the fix, or with
  # --in-place to apply it.
  - repo: local
    hooks:
      - id: recount-patch
        name: patch hunk headers are correct
        entry: tools/recount-patch.py --check
        language: system
        files: ^_patches/.*\.patch$

  # A patch's Depends-On footer points at a change on review.opendev.org.
  # Nothing in the build reads it, so a wrong link stays invisible until a
  # gate job behaves oddly. Only the offline checks run here -- the URL is
  # well formed, and a committed <patch>-message has not drifted away from
  # the patch it was generated from, which is how one copy of a footer ends
  # up fixed and the other stale. _build/test-apply.sh runs the same tool
  # without --offline, which additionally asks Gerrit whether the change
  # exists, is in the project named, and has not been abandoned.
  - repo: local
    hooks:
      - id: check-depends-on
        name: Depends-On footers are well formed
        entry: tools/check-depends-on.py --offline
        language: system
        files: ^_patches/.*\.patch(-message)?$

  # Documentation names code by symbol, not by line number: a line number
  # goes stale on the next edit to the code, in a change that never touches
  # the document. Plans are exempt, being a dated record. The daily
  # consistency audit (docs-line-references) is the backstop, since this
  # hook cannot tell a fenced block of quoted tool output from prose.
  - repo: local
    hooks:
      - id: docs-line-references
        name: No source line-number references in documentation
        language: pygrep
        entry: >-
          \b[\w./-]+\.(py|pyi|rs|go|sh|proto|js|ts|c|h|cc|cpp|toml|ya?ml|j2|html):\d+(?:[-,]\d+)*(?![\d:])|/blob/(?![0-9a-f]{40}/)[^\s)#]+#L\d+
        types: [markdown]
        exclude: (^|/)plans/

  # The launcher under deployer/, tools/write-build-manifest and
  # tools/measure-deployer-bootstrap are the Python this repository lints.
  # All three are also unit tested here: the launcher's tests need no
  # container engine, the manifest tool's need no registry, and the
  # measurement tool's need neither GitHub nor a real log.
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        files: ^(deployer/|tools/(write-build-manifest|test-write-build-manifest\.py|measure-deployer-bootstrap|test-measure-deployer-bootstrap\.py|ci-select-lanes\.py|test-ci-select-lanes\.py|test-ci-merge-group-current\.py)$)
        args: ['--max-line-length=120']

  - repo: local
    hooks:
      - id: deployer-launcher-tests
        name: deployer launcher unit tests
        entry: python3 -m unittest discover -s deployer/launcher -t deployer/launcher
        language: system
        pass_filenames: false
        files: ^deployer/

  # The manifest tool imports requests and click, which the system Python
  # of a pre-commit runner need not have, so this hook gets its own venv.
  - repo: local
    hooks:
      - id: write-build-manifest-tests
        name: write-build-manifest unit tests
        entry: python tools/test-write-build-manifest.py
        language: python
        additional_dependencies: ['click', 'requests']
        pass_filenames: false
        files: ^tools/(write-build-manifest|test-write-build-manifest\.py)$

  # The measurement tool imports click, and shells out to gh only outside
  # these tests.
  - repo: local
    hooks:
      - id: measure-deployer-bootstrap-tests
        name: measure-deployer-bootstrap unit tests
        entry: python tools/test-measure-deployer-bootstrap.py
        language: python
        additional_dependencies: ['click']
        pass_filenames: false
        files: ^tools/(measure-deployer-bootstrap|test-measure-deployer-bootstrap\.py)$

  # The lane selector reads the lanes data file with the standard library
  # only, so this hook needs no venv dependencies. It reruns when the real
  # lanes file changes because one test validates it.
  - repo: local
    hooks:
      - id: ci-select-lanes-tests
        name: ci-select-lanes unit tests
        entry: python tools/test-ci-select-lanes.py
        language: python
        pass_filenames: false
        files: ^(tools/(ci-select-lanes|test-ci-select-lanes)\.py|\.github/ci-lanes\.json)$

  # The superseded merge group check is a copy of the script in
  # shakenfist/shakenfist, tested here against stub git and gh commands.
  - repo: local
    hooks:
      - id: ci-merge-group-current-tests
        name: ci-merge-group-current unit tests
        entry: python tools/test-ci-merge-group-current.py
        language: python
        additional_dependencies: ['pyyaml']
        pass_filenames: false
        files: ^(tools/(ci-merge-group-current\.sh|test-ci-merge-group-current\.py)|\.github/workflows/(functional-tests|rebase-tests|local-container-builds)\.yml)$
