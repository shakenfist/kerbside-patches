repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(_build/|tools/)
        types_or: [sh, bash, shell]
        args: ['-x']
      - id: shellcheck
        name: shellcheck (extensionless scripts)
        files: ^(_build/|tools/)[^/.]+$
        types: [text]
        exclude: '(find_images|spice-connect\.py|extract-commit-message|summarize_layers\.py|analyze-shared-patches\.py|analyze-gerrit-new-roles|analyze-gerrit-patch-size|analyze-gerrit-review-times|gerrit-pre-push-lint)$'
        args: ['-x']

  # skillsaw lints the agent context in this repository -- CLAUDE.md,
  # AGENTS.md and the skills under .claude/ -- for malformed skills,
  # smuggled unicode and pasted credentials. The rev is kept current by
  # renovate's pre-commit manager.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.20.0
    hooks:
      - id: skillsaw

  # Hand editing a patch in _patches/ means keeping the @@ hunk headers in
  # step with the body. A header that is too large makes git reject the
  # patch; one that is too small is worse, because git silently truncates
  # the hunk and applies the wrong content. recount-patch.py --check
  # catches both. Run it without --check to see the fix, or with
  # --in-place to apply it.
  - repo: local
    hooks:
      - id: recount-patch
        name: patch hunk headers are correct
        entry: tools/recount-patch.py --check
        language: system
        files: ^_patches/.*\.patch$

  # A patch's Depends-On footer points at a change on review.opendev.org.
  # Nothing in the build reads it, so a wrong link stays invisible until a
  # gate job behaves oddly. Only the offline checks run here -- the URL is
  # well formed, and a committed <patch>-message has not drifted away from
  # the patch it was generated from, which is how one copy of a footer ends
  # up fixed and the other stale. _build/test-apply.sh runs the same tool
  # without --offline, which additionally asks Gerrit whether the change
  # exists, is in the project named, and has not been abandoned.
  - repo: local
    hooks:
      - id: check-depends-on
        name: Depends-On footers are well formed
        entry: tools/check-depends-on.py --offline
        language: system
        files: ^_patches/.*\.patch(-message)?$
